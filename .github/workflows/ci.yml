name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # THIS STARTS MONGODB FOR TESTS
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install backend
      - name: Install backend
        run: npm --prefix backend ci

      # Install frontend
      - name: Install frontend
        run: npm --prefix frontend ci

      # Run tests + lint
      - name: Run CI
        run: npm run ci